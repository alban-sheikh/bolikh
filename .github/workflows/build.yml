name: Build

# Runs manually (Actions tab → Build → Run workflow) or when a version tag is pushed.
# A tag like v0.2.0 also creates a DRAFT GitHub Release with every installer attached.
# Publishing that draft makes it "latest", and the website's download buttons
# (…/releases/latest/download/<name>) start serving it. File names never change between versions.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: mac-arm
            name: macOS (Apple Silicon)
            os: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg
            rust_targets: aarch64-apple-darwin
          - id: mac-intel
            name: macOS (Intel)
            os: macos-latest
            args: --target x86_64-apple-darwin --bundles dmg
            rust_targets: x86_64-apple-darwin
          - id: windows
            name: Windows
            os: windows-latest
            args: --bundles nsis
            rust_targets: ""
          - id: linux
            name: Linux
            os: ubuntu-24.04
            args: --bundles deb,rpm
            rust_targets: ""
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev libssl-dev patchelf rpm

      - run: npm ci

      - name: Unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build installers
        run: npx tauri build ${{ matrix.args }}
        # Code signing: add APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
        # APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID as repository secrets and pass them here as env.

      - name: Give installers their fixed download names
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          B=src-tauri/target
          case "${{ matrix.id }}" in
            mac-arm)   cp $B/aarch64-apple-darwin/release/bundle/dmg/*.dmg out/Bolikh-macos-apple-silicon.dmg ;;
            mac-intel) cp $B/x86_64-apple-darwin/release/bundle/dmg/*.dmg  out/Bolikh-macos-intel.dmg ;;
            windows)   cp $B/release/bundle/nsis/*.exe out/Bolikh-windows-x64-setup.exe ;;
            linux)     cp $B/release/bundle/deb/*.deb  out/Bolikh-linux-amd64.deb
                       cp $B/release/bundle/rpm/*.rpm  out/Bolikh-linux-x86_64.rpm ;;
          esac
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: bolikh-${{ matrix.id }}
          path: out/*
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (cd out && sha256sum * > SHA256SUMS.txt)
          gh release create "${{ github.ref_name }}" out/* --repo "${{ github.repository }}" \
            --draft --title "Bolikh ${{ github.ref_name }}" \
            --notes "Downloads for macOS, Windows and Linux. Setup guide: see the website."
