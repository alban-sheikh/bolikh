name: Build

# Runs manually (Actions tab → Build → Run workflow) or when a version tag is pushed.
# A tag like v0.2.0 also creates a DRAFT GitHub Release with every installer attached.
# Publishing that draft makes it "latest", and the website's download buttons
# (…/releases/latest/download/<name>) start serving it. File names never change between versions.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: mac-arm
            name: macOS (Apple Silicon)
            os: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg
            rust_targets: aarch64-apple-darwin
          - id: windows
            name: Windows
            os: windows-latest
            args: --bundles nsis
            rust_targets: ""
          - id: linux
            name: Linux
            os: ubuntu-24.04
            args: --bundles deb,rpm
            rust_targets: ""
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev libssl-dev patchelf rpm

      - name: Collect the Visual C++ runtime (Windows)
        # Bolikh ships these DLLs next to its .exe ("app-local" deployment, allowed by Microsoft's
        # redistribution terms), so it runs on PCs without the VC++ Redistributable and without admin rights.
        # src-tauri/tauri.windows.conf.json lists them as resources installed beside the app.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC" -Directory | Where-Object Name -match '^\d' | Sort-Object { [version]$_.Name } |
                 Select-Object -Last 1 | ForEach-Object { Get-ChildItem "$($_.FullName)\x64" -Directory -Filter 'Microsoft.VC14*.CRT' } | Select-Object -First 1
          if (-not $crt) { throw "VC++ runtime folder not found" }
          Write-Host "Using $($crt.FullName)"
          New-Item -ItemType Directory -Force src-tauri\vcruntime | Out-Null
          Copy-Item "$($crt.FullName)\*.dll" src-tauri\vcruntime\
          Get-ChildItem src-tauri\vcruntime

      - run: npm ci

      - name: Unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build installers
        run: npx tauri build ${{ matrix.args }}
        # Code signing: add APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
        # APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID as repository secrets and pass them here as env.

      - name: Give installers their fixed download names
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          B=src-tauri/target
          case "${{ matrix.id }}" in
            mac-arm)   cp $B/aarch64-apple-darwin/release/bundle/dmg/*.dmg out/Bolikh-macos-apple-silicon.dmg ;;
            windows)   cp $B/release/bundle/nsis/*.exe out/Bolikh-windows-x64-setup.exe ;;
            linux)     cp $B/release/bundle/deb/*.deb  out/Bolikh-linux-amd64.deb
                       cp $B/release/bundle/rpm/*.rpm  out/Bolikh-linux-x86_64.rpm ;;
          esac
          ls -la out

      - name: Check the Windows installer contains the VC++ runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe | Where-Object FullName -match 'Hostx64\\x64' | Select-Object -First 1
          Write-Host "DLLs the app needs:"; & $dumpbin.FullName /dependents src-tauri\target\release\aazad-voice.exe
          7z l out\Bolikh-windows-x64-setup.exe | Select-String -Pattern '\.dll' | Tee-Object -Variable dlls
          foreach ($d in 'vcruntime140.dll','vcruntime140_1.dll','msvcp140.dll') {
            if (-not ($dlls -match [regex]::Escape($d))) { throw "$d is missing from the installer" }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: bolikh-${{ matrix.id }}
          path: out/*
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (cd out && sha256sum * > SHA256SUMS.txt)
          gh release create "${{ github.ref_name }}" out/* --repo "${{ github.repository }}" \
            --draft --title "Bolikh ${{ github.ref_name }}" \
            --notes "Downloads for macOS, Windows and Linux. Setup guide: see the website."
