name: Deploy website

# Deploys the website to production on Vercel (bolikh.aazadsoftwaresolutions.in):
#   - on every change merged into main that touches website/
#   - whenever a GitHub release is published (so the hosted installers update)
#   - by hand from the Actions tab
# The installers of the latest published release are copied into website/downloads/ during the deploy,
# so visitors download from this website; GitHub stays available as a backup link.
#
# Setup (once):
#   - Repository secret   AAZAD_VERCEL_TOKEN : a Vercel access token from the Aazad Vercel account
#   - Repository variable VERCEL_ORG_ID      : team_AKtQAZ9qQ6NmumJkiPTZdG1P
#   - Repository variable VERCEL_PROJECT_ID  : prj_LDBRQnHw9FUTclxvHaDwWyv6jYHv
#
# The site is deployed from a copy of website/ without git history: on Vercel's Hobby plan, deployments
# whose commit author isn't a member of the Vercel team are blocked.
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: deploy-website
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Vercel (production)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Vercel settings
        env:
          VERCEL_TOKEN: ${{ secrets.AAZAD_VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          missing=""
          [ -n "$VERCEL_TOKEN" ] || missing="$missing secret AAZAD_VERCEL_TOKEN;"
          [ -n "$VERCEL_ORG_ID" ] || missing="$missing variable VERCEL_ORG_ID;"
          [ -n "$VERCEL_PROJECT_ID" ] || missing="$missing variable VERCEL_PROJECT_ID;"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository settings:$missing Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Stage website without git history
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/site/.vercel"
          cp -R website "$RUNNER_TEMP/site/website"
          printf '{"projectId":"%s","orgId":"%s"}\n' "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > "$RUNNER_TEMP/site/.vercel/project.json"

      - name: Add the latest release's installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          site="$RUNNER_TEMP/site/website"
          d="$site/downloads"
          mkdir -p "$d"
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          ver="${tag#v}"
          case "$ver" in ''|*[!0-9.]*) echo "::error::Unexpected release tag: $tag"; exit 1 ;; esac
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$d" --pattern 'Bolikh-*' --pattern 'SHA256SUMS.txt'
          (cd "$d" && sha256sum -c SHA256SUMS.txt)

          # On this website the installers carry the version in their name
          # (Bolikh-0.3.0-macos-apple-silicon.dmg), so a downloaded file says which version it is.
          # The release on GitHub keeps the plain names, which keeps its "latest" links working.
          cd "$d"
          for f in Bolikh-*; do mv "$f" "Bolikh-$ver-${f#Bolikh-}"; done
          sed -i "s/  Bolikh-/  Bolikh-$ver-/" SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          ls -la

          # The pages name the files in their instructions and show the version: fill both in.
          cd "$site"
          names='macos-apple-silicon\.dmg|windows-x64-setup\.exe|linux-amd64\.deb|linux-x86_64\.rpm'
          sed -i -E "s/Bolikh-($names)/Bolikh-$ver-\\1/g" ./*.html
          sed -i -E "s|(<span id=\"ver\">)[^<]*|\\1$ver|; s|^(  version: \")[^\"]*|\\1$ver|" index.html
          grep -q "Bolikh-$ver-linux-amd64.deb" index.html
          grep -q "<span id=\"ver\">$ver<" index.html
          # Tells the download counter which file names to send people to.
          printf '{"version":"%s"}\n' "$ver" > api/_release.json
          echo "ver=$ver" >> "$GITHUB_ENV"

      - name: Deploy
        working-directory: ${{ runner.temp }}/site
        env:
          VERCEL_TOKEN: ${{ secrets.AAZAD_VERCEL_TOKEN }}
        run: |
          npx --yes vercel@65.15.0 deploy --prod --yes --token "$VERCEL_TOKEN"
          echo "### Website deployed to production: https://bolikh.aazadsoftwaresolutions.in" >> "$GITHUB_STEP_SUMMARY"

      - name: Check the live site
        run: |
          sleep 5
          fail=0
          for p in "" downloads/SHA256SUMS.txt "downloads/Bolikh-$ver-macos-apple-silicon.dmg" "downloads/Bolikh-$ver-windows-x64-setup.exe" "downloads/Bolikh-$ver-linux-amd64.deb" "downloads/Bolikh-$ver-linux-x86_64.rpm"; do
            code=$(curl -s -o /dev/null -I -w "%{http_code}" "https://bolikh.aazadsoftwaresolutions.in/$p")
            echo "/$p → HTTP $code"
            [ "$code" = "200" ] || fail=1
          done
          # The download counter must redirect to the hosted file (HEAD requests aren't counted).
          loc=$(curl -s -o /dev/null -I -w "%{http_code} %{redirect_url}" "https://bolikh.aazadsoftwaresolutions.in/api/download/mac")
          echo "/api/download/mac → $loc"
          case "$loc" in "302 "*"/downloads/Bolikh-$ver-macos-apple-silicon.dmg") ;; *) fail=1 ;; esac
          exit $fail
