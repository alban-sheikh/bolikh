name: Deploy website

# Deploys the website to production on Vercel (bolikh.aazadsoftwaresolutions.in):
#   - on every change merged into main that touches website/
#   - whenever a GitHub release is published (so the hosted installers update)
#   - by hand from the Actions tab
# The installers of the latest published release are copied into website/downloads/ during the deploy,
# so visitors download from this website; GitHub stays available as a backup link.
#
# Setup (once):
#   - Repository secret   AAZAD_VERCEL_TOKEN : a Vercel access token from the Aazad Vercel account
#   - Repository variable VERCEL_ORG_ID      : team_AKtQAZ9qQ6NmumJkiPTZdG1P
#   - Repository variable VERCEL_PROJECT_ID  : prj_LDBRQnHw9FUTclxvHaDwWyv6jYHv
#
# The site is deployed from a copy of website/ without git history: on Vercel's Hobby plan, deployments
# whose commit author isn't a member of the Vercel team are blocked.
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: deploy-website
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Vercel (production)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Vercel settings
        env:
          VERCEL_TOKEN: ${{ secrets.AAZAD_VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          missing=""
          [ -n "$VERCEL_TOKEN" ] || missing="$missing secret AAZAD_VERCEL_TOKEN;"
          [ -n "$VERCEL_ORG_ID" ] || missing="$missing variable VERCEL_ORG_ID;"
          [ -n "$VERCEL_PROJECT_ID" ] || missing="$missing variable VERCEL_PROJECT_ID;"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository settings:$missing Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Stage website without git history
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/site/.vercel"
          cp -R website "$RUNNER_TEMP/site/website"
          printf '{"projectId":"%s","orgId":"%s"}\n' "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > "$RUNNER_TEMP/site/.vercel/project.json"

      - name: Add the latest release's installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          d="$RUNNER_TEMP/site/website/downloads"
          mkdir -p "$d"
          gh release download --repo "$GITHUB_REPOSITORY" --dir "$d" --pattern 'Bolikh-*' --pattern 'SHA256SUMS.txt'
          (cd "$d" && sha256sum -c SHA256SUMS.txt)
          ls -la "$d"

      - name: Deploy
        working-directory: ${{ runner.temp }}/site
        env:
          VERCEL_TOKEN: ${{ secrets.AAZAD_VERCEL_TOKEN }}
        run: |
          npx --yes vercel@65.15.0 deploy --prod --yes --token "$VERCEL_TOKEN"
          echo "### Website deployed to production: https://bolikh.aazadsoftwaresolutions.in" >> "$GITHUB_STEP_SUMMARY"

      - name: Check the live site
        run: |
          sleep 5
          fail=0
          for p in "" downloads/SHA256SUMS.txt downloads/Bolikh-macos-apple-silicon.dmg downloads/Bolikh-windows-x64-setup.exe downloads/Bolikh-linux-amd64.deb downloads/Bolikh-linux-x86_64.rpm; do
            code=$(curl -s -o /dev/null -I -w "%{http_code}" "https://bolikh.aazadsoftwaresolutions.in/$p")
            echo "/$p → HTTP $code"
            [ "$code" = "200" ] || fail=1
          done
          exit $fail
