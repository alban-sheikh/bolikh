[package]
name = "aazad-voice"
version = "0.2.0"
description = "Private, offline dictation for every app"
edition = "2021"
license = "Proprietary"

[lib]
name = "aazad_voice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
regex = "1"
once_cell = "1"
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
cpal = "0.16"
handy-keys = "0.3.4"
enigo = "0.6"
arboard = { version = "3", features = ["wayland-data-control"] }
transcribe-rs = { version = "0.3.12", features = ["onnx"] }
# transcribe-rs 0.3.12 is built against this exact ort API.
ort = { version = "=2.0.0-rc.12", default-features = false }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true
